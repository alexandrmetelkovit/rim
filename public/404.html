<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Сохраняем путь, по которому хотел перейти пользователь
      sessionStorage.setItem(
        'redirect',
        window.location.pathname + window.location.search + window.location.hash
      );
      // Редиректим на главную страницу приложения
      window.location.replace('/rim/');
    </script>
  </head>
  <body></body>
</html>
